# 1.0.1-nightly.20260923.1
#
# Hand-seeded, not pipeline-produced -- `build_id: manually seeded`, which VERSIONING.md
# allows for exactly this.
#
# Taken whole from the preprod set rather than bumped off the previous nightly. That nightly
# is 1.0.1-nightly.20260817.1, five weeks old, and the components in it do not work together
# any more: router 0.1.213 refuses the eval create, route_selector 0.1.80 has no bundle-import
# endpoint, and 0.1.101 will not start under the bundle's older chart. Pinning around it one
# component at a time does not converge. Preprod's set is coherent and running, so it is the
# base, and it is newer on all 38 charts the old nightly carried.
#
# New here: the self-serve (Divyam Switch) stack. Those charts and images publish to the DEV
# GAR rather than the public one, so each carries a per-chart repository override -- that
# override is the only lane change, and no other chart is affected. Promotion is what moves
# them to the prod registry, at which point the overrides come off.
#
# self-serve-postgres is pinned here although preprod does not pin it: a box runs switch
# against an in-cluster CNPG cluster, where preprod uses an external Postgres.
